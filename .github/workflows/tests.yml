# Runs the unit tests on every pull request and on every push to main.
# The tests use only the Python standard library and don't need the downloaded prices.
# Branch protection (.github/branch-protection.json) requires the tests-passed job before a merge.
# The push run re-tests what the pull request already tested; it keeps the README badge current for main.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false  # finish every version, to see whether a failure is version-specific
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v

  # The one check branch protection requires. Requiring this instead of each "unittest (3.x)" job lets the
  # Python versions above change without editing the protection, which would otherwise wait forever for
  # a version that no longer runs.
  tests-passed:
    needs: unittest
    if: always()  # run even when unittest fails; a skipped required check would count as passing
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.unittest.result }}
